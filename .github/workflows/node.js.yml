name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Least privilege: the default GITHUB_TOKEN is read-only. Elevate per-job only
# where a job actually needs write access (none does here).
permissions:
  contents: read

# Cancel superseded runs on the same branch / PR to cut race + cost surface.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # Test the engines floor (22.x = latest 22 line) and the EXACT pinned dev/
    # runtime version (26.13.0, see .node-version). The pinned leg is exact, not
    # a 24.x range: setup-node resolves ranges to whatever 24.y.z the runner has
    # cached, which would not actually exercise the version we pinned. fail-fast
    # off so one leg's failure does not mask the other's result.
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 26.13.0]

    steps:
      # Actions are pinned to a full 40-char commit SHA (+ trailing version
      # comment) so a re-tagged release can't swap the code under us. Dependabot
      # (.github/dependabot.yml) bumps the SHA + comment together; do not revert
      # these pins to floating tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
        # pnpm version is auto-detected from the package.json "packageManager" field.

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Dependency audit — production paths (blocking)
        # A high advisory on a PRODUCTION path fails the build, because nothing
        # else catches it. This step exists because the previous single advisory
        # step below was non-blocking on the theory that "real triage happens in
        # the Dependabot PR" — and that theory did not hold for the case that
        # actually occurred (js-yaml GHSA-5p4m-2wfm-xmqj):
        #   * Dependabot alerts were ENABLED yet reported 0 open alerts;
        #   * dependabot.yml's `updates:` bumps DIRECT dependencies, and js-yaml
        #     is transitive, so no PR could be raised there either.
        # So `pnpm audit` was the only detector, and it was configured to be
        # invisible. Scoped to --prod so dev-only noise cannot make this the step
        # people learn to ignore, which is how the last one stopped being read.
        run: pnpm audit --prod --audit-level high

      - name: Dependency audit — full tree (advisory, non-blocking)
        # Dev-tree advisories stay visible but non-blocking. If something here
        # needs action it gets promoted to the blocking step above or waived
        # explicitly; it does not sit unread as the only signal.
        continue-on-error: true
        run: pnpm audit --audit-level moderate

      # oxlint first: a fast (Rust) correctness pass that fails the build in
      # milliseconds before the heavier ESLint / type / build / test steps.
      - run: pnpm run lint:ox
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm test

  # macOS leg. The security boundary leans on filesystem behaviour that differs
  # by platform — realpath, symlinks, NFC/NFD, and case-insensitive identity —
  # and macOS is this project's primary deployment, while the job above runs on
  # Linux only. Some tests exist for macOS alone and skip themselves elsewhere
  # (e.g. the case-variant state-file test in tests/config.test.ts); this job is
  # where they run in CI.
  #
  # A SEPARATE job, not an `os` axis on the matrix above: the ruleset requires
  # the checks by name ("build (22.x)", "build (26.13.0)"), and an extra matrix
  # key renames every leg ("build (22.x, ubuntu-latest)"), after which the
  # required checks never report and every PR blocks. An `include` entry that
  # adds `os` to 26.13.0 would instead merge into that existing leg and move it
  # to macOS. Whether this job becomes a required check is a ruleset decision,
  # made separately.
  #
  # Only the pinned runtime (26.13.0): the engines floor is covered on Linux,
  # and what this leg adds is the platform, not another Node line. Lint, format
  # and the audits are platform-independent and already run above.
  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1

      - name: Use Node.js 26.13.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      # The timing file runs in build-macos-timing below, on its own runners.
      - run: pnpm test --exclude tests/logRedactionPerf.test.ts

  # macOS timing leg. tests/logRedactionPerf.test.ts judges how time grows with
  # input size. In build-macos it took 3,369 s of a 3,529 s test run (job
  # 129579383573, 2026-11-10), most of it in the shipped masks' Issue 295
  # group, and it shared the runner with the other test files, which can load
  # one side of a timed pair. A red there also could not say whether a timing
  # check or a behaviour check had failed. Here the file runs on its own
  # runners, split by test name so the parts run in parallel:
  #   rest     every test outside the shipped masks' group, so a group added
  #            to the file later still runs on macOS
  #   capture  the shipped masks' group for capture-command.sh
  #   others   the same group for every other copy (archive-session.sh today)
  # The three patterns cover the file without overlap. If the group or copy
  # names change, check that they still do. The Linux legs above still run the
  # whole file. Like build-macos, this is not a required check.
  build-macos-timing:
    name: build-macos-timing (${{ matrix.part }})
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - part: rest
            pattern: "^(?!.*Issue 295 time over two doublings)"
          - part: capture
            pattern: "Issue 295 time over two doublings.*capture: "
          - part: others
            pattern: "Issue 295 time over two doublings(?!.*capture: )"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1

      - name: Use Node.js 26.13.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Timing tests (${{ matrix.part }})
        # Passed through the environment, not spliced into the script.
        env:
          PATTERN: ${{ matrix.pattern }}
        run: pnpm test tests/logRedactionPerf.test.ts -t "$PATTERN"
