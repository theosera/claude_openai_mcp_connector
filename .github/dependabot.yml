# Dependabot — keep npm dependencies and SHA-pinned Actions current.
#
# Actions in .github/workflows/* are pinned to commit SHAs (supply-chain
# hardening); floating tags are intentionally not followed, so without Dependabot
# those pins silently go stale. This opens weekly PRs (grouped to reduce noise)
# bumping action SHAs + their `# vX.Y.Z` comments and npm deps. PRs that touch
# .github/ are routed to the code owner for review. CODEOWNERS routes; it does
# not block a merge — see SECURITY.md for what the ruleset actually enforces.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      npm:
        patterns:
          - "*"
        # Majors are kept OUT of the group, so one arrives as its own pull
        # request instead of inside a batch. docs/dependency-policy.md already
        # required that -- "Majors are opt-in ... never as part of a batch" --
        # but until this line the rule was carried only by whoever read the
        # diff, and #195 batched vitest ^4.1.11 -> ^5.0.0 with four minor and
        # patch bumps and was merged that way. Excluded here means "its own
        # PR", not "never": Dependabot still opens majors, one at a time, where
        # the compatibility check the policy asks for has something to attach
        # to. The github-actions group above is deliberately left alone; its
        # majors are a separate decision, not an oversight.
        update-types:
          - "minor"
          - "patch"
